<div class="grid grid-cols-1 gap-4 md:grid-cols-3">
  @for (column of columns; track column.status) {
    <div
      class="flex min-h-125 flex-col rounded-xl bg-gray-50 p-3"
      (dragover)="allowDrop($event)"
      (drop)="dropTask($event, column.status)"
    >
      <!-- Column header -->
      <div class="mb-3 flex items-center justify-between px-1">
        <h2 class="text-sm font-semibold text-gray-700">
          {{ column.title }}
        </h2>

        <span class="rounded-full bg-white px-2 py-1 text-xs font-medium text-gray-500">
          {{ tasksForColumn(column.status).length }}
        </span>
      </div>

      <!-- Tasks -->
      <div class="flex flex-1 flex-col gap-3">
        @for (task of tasksForColumn(column.status); track task.id) {
          <div draggable="true" (dragstart)="startDrag(task)">
            <app-task-card
              [task]="task"
              (edit)="onEdit($event)"
              (delete)="onDelete($event)"
              (statusChange)="onStatusChange($event)"
            />
          </div>
        } @empty {
          <div
            class="flex flex-1 items-center justify-center rounded-lg border border-dashed border-gray-300 text-sm text-gray-400"
          >
            Drop tasks here
          </div>
        }
      </div>
    </div>
  }
</div>
